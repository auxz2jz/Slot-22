name: Browser startup smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Start static web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/static-server.log 2>&1 &
          sleep 2
      - name: Run Chrome DevTools browser smoke and capture console errors
        run: node tests/browser-smoke.mjs
